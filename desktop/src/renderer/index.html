<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; media-src 'self' file:; style-src 'self'; script-src 'self'">
  <title>SmartTV</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="home" class="screen">
    <header class="topbar">
      <div class="brand">Smart<span>TV</span></div>
      <div class="status">
        <span id="remoteStatus" class="remote-status hidden">Пульт подключён</span>
        <div class="clock">
          <div id="clockTime" class="clock-time"></div>
          <div id="clockDate" class="clock-date"></div>
        </div>
      </div>
    </header>
    <main id="rows" class="rows">
      <section class="row" data-row="apps">
        <h2>Приложения</h2>
        <div class="row-items" id="tilesRow"></div>
      </section>
      <section class="row" data-row="videos">
        <h2 id="videosTitle">Мои видео</h2>
        <div class="row-items" id="videosRow"></div>
      </section>
      <section class="row" data-row="settings">
        <h2>Настройки</h2>
        <div class="row-items" id="settingsRow"></div>
      </section>
    </main>
    <footer class="hints">
      <span><kbd>←↑↓→</kbd> выбор</span>
      <span><kbd>Enter</kbd> открыть</span>
      <span><kbd>Esc</kbd> назад</span>
      <span><kbd>Ctrl+H</kbd> домой</span>
      <span><kbd>F11</kbd> во весь экран</span>
    </footer>
  </div>

  <div id="player" class="screen player hidden">
    <video id="video" preload="auto"></video>
    <div id="osd" class="osd">
      <div id="osdTitle" class="osd-title"></div>
      <div class="osd-bar"><div id="osdProgress" class="osd-progress"></div></div>
      <div class="osd-meta">
        <span id="osdState"></span>
        <span id="osdTime"></span>
      </div>
      <div class="osd-hint">Enter — пауза · ←/→ — 10 с · ↑/↓ — 1 мин · Esc — выход</div>
    </div>
    <div id="playerError" class="player-error hidden"></div>
  </div>

  <div id="dialogs"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
