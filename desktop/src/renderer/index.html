<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>SmartTV</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="panel">
    <section class="left">
      <div class="brand">Smart<span>TV</span></div>

      <div id="tvState" class="tv-state">
        <div id="spinner" class="spinner"></div>
        <div>
          <h1 id="tvTitle">Запуск Google TV…</h1>
          <p id="tvDetail" class="muted"></p>
        </div>
      </div>

      <div id="help" class="help hidden"></div>

      <div class="actions">
        <button id="btnTv" class="btn primary focusable hidden">Вернуться в Google TV</button>
        <button id="btnRestart" class="btn focusable">Перезапустить Google TV</button>
        <button id="btnQuit" class="btn focusable">Выключить SmartTV</button>
      </div>

      <p class="muted hint">Панель SmartTV открывается сочетанием <kbd>Ctrl+Alt+S</kbd> или из значка в трее.</p>
    </section>

    <section class="right">
      <h2>Подключить пульт</h2>
      <div id="pair" class="pair"></div>
      <h3>Подключённые телефоны</h3>
      <div id="devices" class="devices"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
